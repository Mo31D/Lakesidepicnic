  <style>
    body {
      margin: 0;
      background: #111;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      min-height: 100vh;
      padding: 20px;
    }

    .fridge-container {
      width: 90vw;
      max-width: 1000px;
      background: #fff;
      border: 10px solid #d10000;
      border-radius: 10px;
      display: flex;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
      margin-bottom: 40px;
    }

    .door {
      width: 50%;
      background: #f4f4f4;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      box-sizing: border-box;
    }

    .shelf {
      flex: 1;
      margin: 10px 0;
      background: #e6e6e6;
      border: 2px solid #ccc;
      border-radius: 5px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .drink {
      width: 70px;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      position: relative;
    }

    .drink img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    /* Crisp Baskets and Sweet Shelves */
    .snack-section {
      width: 90vw;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .basket, .sweet-shelf {
      flex: 1;
      background: #333;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .snack-title {
      color: #fff;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
      width: 100%;
    }

    .snack {
      width: 60px;
      height: 60px;
    }

    .snack img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
<body>
