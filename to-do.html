<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore Ambleside</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      padding-bottom: 60px;
    }
    #map {
      height: 500px;
    }
    .dark-mode {
      background-color: #121212;
      color: white;
    }
    .navbar.fixed-bottom {
      background-color: #f8f9fa;
      border-top: 1px solid #ccc;
    }
    .list-group-item {
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container mt-3">
  <h1>Explore Ambleside</h1>
  <button onclick="toggleTheme()" class="btn btn-secondary mb-3">Toggle Dark Mode</button>

  <div id="map" class="mb-3"></div>

  <h3>Places to Explore Around Ambleside</h3>
  <div class="list-group mb-5" id="locationList"></div>
</div>

<nav class="navbar fixed-bottom">
  <div class="container-fluid justify-content-around">
    <a class="nav-link" href="#">Home</a>
    <a class="nav-link" href="#map">Map</a>
    <a class="nav-link" href="#">Itinerary</a>
    <a class="nav-link" href="#">Settings</a>
  </div>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const apiKey = "5nLkA3mxTaA446LXiRMbw9fh5JkK6Lg6";

  const map = L.map('map').setView([54.4313, -2.9625], 13);

  L.tileLayer(`https://api.os.uk/maps/raster/v1/zxy/Road_3857/{z}/{x}/{y}.png?key=${apiKey}`, {
    maxZoom: 18,
    attribution: '&copy; Ordnance Survey'
  }).addTo(map);

  const places = [
    {
      name: "Borrans Park",
      desc: "A tranquil lakeside park ideal for picnics, with expansive green spaces and scenic views of Lake Windermere. Adjacent to the park are the remains of the Galava Roman Fort, providing a glimpse into the area’s ancient history.",
      coords: [54.4275, -2.9637]
    },
    {
      name: "Stock Ghyll Force Waterfalls",
      desc: "A picturesque 70-foot waterfall nestled within a wooded glen, just a short walk from Ambleside town center. The trail offers a serene escape, with the sound of cascading water accompanying your journey.",
      coords: [54.4340, -2.9596]
    },
    {
      name: "Bridge House",
      desc: "An iconic 17th-century structure built over Stock Beck, originally serving as an apple store. It’s renowned as one of the most photographed buildings in the Lake District.",
      coords: [54.4313, -2.9625]
    },
    {
      name: "Rydal Water",
      desc: "A serene lake situated between Ambleside and Grasmere, offering gentle walks and connections to poet William Wordsworth, who found inspiration in its surroundings.",
      coords: [54.4444, -3.0124]
    },
    {
      name: "Rydal Cave",
      desc: "A man-made cavern resulting from historical slate quarrying, located above Rydal Water. Visitors can explore its depths via stepping stones and may spot small fish in the shallow waters.",
      coords: [54.4448, -3.0171]
    },
    {
      name: "Ambleside Roman Fort (Galava)",
      desc: "Dating back to the 2nd century, these well-preserved ruins offer insights into Roman military architecture and are situated near the northern shore of Lake Windermere.",
      coords: [54.4279, -2.9642]
    },
    {
      name: "Rothay Park",
      desc: "A family-friendly park in the heart of Ambleside, featuring open fields, a children’s play area, and serving as a gateway to various walking trails leading into the surrounding fells.",
      coords: [54.4311, -2.9682]
    },
    {
      name: "Self-Drive Electric Motor Boats",
      desc: "Experience Lake Windermere at your own pace by hiring an electric motorboat from Ambleside. No prior boating experience is necessary, and safety instructions are provided.",
      coords: [54.4243, -2.9652]
    },
    {
      name: "Windermere Lake Cruises",
      desc: "Embark on a scenic cruise across England’s largest lake, with routes connecting Ambleside, Bowness, Brockhole, and Lakeside. Options range from short trips to full-day explorations.",
      coords: [54.4247, -2.9648]
    },
    {
      name: "Stagshaw Garden",
      desc: "An informal woodland garden managed by the National Trust, renowned for its vibrant displays of rhododendrons and azaleas, especially in spring.",
      coords: [54.4177, -2.9646]
    },
    {
      name: "Buckstones Jump",
      desc: "A hidden gem near Rydal, this natural plunge pool is fed by cascading waterfalls, making it a popular spot for wild swimming during warmer months.",
      coords: [54.4480, -3.0145]
    },
    {
      name: "Loughrigg Fell",
      desc: "A moderate hike offering panoramic views of the surrounding lakes and fells. The route includes the scenic Loughrigg Terrace and provides access to Rydal Cave.",
      coords: [54.4370, -3.0168]
    }
  ];

  places.forEach(place => {
    const marker = L.marker(place.coords).addTo(map);
    marker.bindPopup(`<strong>${place.name}</strong><br>${place.desc}<br>
      <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(place.name + ' Ambleside')}" target="_blank">Google Maps</a> |
      <a href="http://maps.apple.com/?daddr=${encodeURIComponent(place.name + ' Ambleside')}" target="_blank">Apple Maps</a>
    `);

    // Add to list
    const listItem = document.createElement("a");
    listItem.className = "list-group-item list-group-item-action";
    listItem.innerText = place.name;
    listItem.onclick = () => {
      map.setView(place.coords, 15);
      marker.openPopup();
    };
    document.getElementById("locationList").appendChild(listItem);
  });

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
  }
</script>

</body>
</html>
