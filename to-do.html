  "desc": "Experience the thrill of soaring through the trees at Brockhole Zip World, located within the Brockhole on Windermere Visitor Centre. Just a 15-minute walk (0.7 mi) from Lakeside Picnic, this adventure attraction offers a zip line course that provides stunning views of Lake Windermere and the surrounding fells. Suitable for both adults and children, the course includes multiple zip lines of varying lengths and heights, ensuring an exhilarating experience for all participants. Safety equipment and briefings are provided by trained staff. The attraction operates seasonally, so it's advisable to check opening times and book in advance.",

  places.forEach(place => {
    const marker = L.marker(place.coords).addTo(map);
    marker.bindPopup(`
      <strong>${place.name}</strong><br>
      <img src="${place.image}" alt="${place.name}" style="width:100%; max-height:150px; object-fit:cover; margin:6px 0;"><br>
      ${place.desc}<br>
      <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(place.name + ' Ambleside')}" target="_blank">Google Maps</a> |
      <a href="http://maps.apple.com/?daddr=${encodeURIComponent(place.name + ' Ambleside')}" target="_blank">Apple Maps</a>
    `);

    const listItem = document.createElement("a");
    listItem.className = "list-group-item list-group-item-action";
    listItem.innerText = place.name;
    listItem.onclick = () => {
      map.setView(place.coords, 15);
      marker.openPopup();
    };
    document.getElementById("locationList").appendChild(listItem);
  });

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
  }
</script>

<script>
  // Route 1: Lakeside Picnic Loop
const routeMap = L.map('routeMap').setView([54.42086, -2.96236], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:
    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(routeMap);

const waypoints = [
  L.latLng(54.4208134, -2.9624932),
  L.latLng(54.4215492, -2.9653692),
  L.latLng(54.4223490, -2.9686860),
	L.latLng(54.4319022, -2.9618420),
  L.latLng(54.4327400, -2.9511095)
];

const placeNames = [
  '1. Lakeside Picnic (Starting Point)',
  '2. Borrans Park',
	'3. Roman Fort (Galava)',
  '4. Ambleside',
  '5. Stock Ghyll Force Waterfall'
];

L.Routing.control({
  waypoints: waypoints,
  routeWhileDragging: false,
  show: false,
  addWaypoints: false,
  draggableWaypoints: false,
  fitSelectedRoutes: true,
  createMarker: function(i, waypoint, n) {
    return L.marker(waypoint.latLng).bindPopup(placeNames[i] || `Stop ${i}`);
  },
}).addTo(routeMap);
