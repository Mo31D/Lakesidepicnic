<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore Ambleside: This Page is not ready yet!</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      padding-bottom: 60px;
    }
    #map {
      height: 500px;
    }
    .dark-mode {
      background-color: #121212;
      color: white;
    }
    .navbar.fixed-bottom {
      background-color: #f8f9fa;
      border-top: 1px solid #ccc;
    }
    .list-group-item {
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container mt-3">
  <h1>Explore Ambleside: This Page is not ready yet!</h1>
  <button onclick="toggleTheme()" class="btn btn-secondary mb-3">Toggle Dark Mode</button>

  <div id="map" class="mb-3"></div>

  <h3>Places to Explore Around Ambleside</h3>
  <div class="list-group mb-5" id="locationList"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const apiKey = "5nLkA3mxTaA446LXiRMbw9fh5JkK6Lg6";

  const map = L.map('map').setView([54.4313, -2.9625], 13);

  L.tileLayer(`https://api.os.uk/maps/raster/v1/zxy/Road_3857/{z}/{x}/{y}.png?key=${apiKey}`, {
    maxZoom: 18,
    attribution: '&copy; Ordnance Survey'
  }).addTo(map);

  const places = [
    {
      name: "Borrans Park",
      desc: "A tranquil lakeside park ideal for picnics, with expansive green spaces and scenic views of Lake Windermere. Adjacent to the park are the remains of the Galava Roman Fort.",
      coords: [54.4216103, -2.9654731],
      image: "to-do/Borrans.jpeg"
    },
    {
      name: "Stock Ghyll Force Waterfalls",
      desc: "A picturesque 70-foot waterfall nestled within a wooded glen, just a short walk from Ambleside town center.",
      coords: [54.4327732, -2.9511477],
      image: "to-do/Stockghyll.jpeg"
    },
    {
      name: "Bridge House",
      desc: "An iconic 17th-century structure built over Stock Beck, originally serving as an apple store.",
      coords: [54.4331769, -2.9635570],
      image: "to-do/Bridgeh.jpeg"
    },
    {
      name: "Rydal Water",
      desc: "A serene lake situated between Ambleside and Grasmere, offering gentle walks and Wordsworth connections.",
      coords: [54.4453340, -2.9906268],
      image: "to-do/Rydalw.webp"
    },
    {
      name: "Rydal Cave",
      desc: "A man-made cavern from historical slate quarrying, with stepping stones and clear water.",
      coords: [54.4432836, -2.9964432],
      image: "to-do/Cave.jpeg"
    },
    {
      name: "Roman Fort (Galava)",
      desc: "2nd-century Roman ruins near Lake Windermere’s north shore.",
      coords: [54.4223508, -2.9686867],
      image: "to-do/Roman.jpeg"
    },
    {
      name: "Rothay Park",
      desc: "Family park with trails, playground, and access to surrounding fells.",
      coords: [54.4313218, -2.9686897],
      image: "to-do/Rothay.jpeg"
    },
    {
      name: "Self-Drive Electric Motor Boats",
      desc: "Hire a boat on Windermere and cruise freely.",
      coords: [54.4201328, -2.9619859],
      image: "to-do/Self.jpeg"
    },
    {
      name: "Boat Trip",
      desc: "Scenic boat rides between Ambleside, Bowness & more.",
      coords: [54.4197226, -2.9621894],
      image: "to-do/Boat.jpeg"
    },
    {
      name: "Stagshaw Garden",
      desc: "Woodland garden with azaleas and rhododendrons.",
      coords: [54.4174042, -2.9565742],
      image: "to-do/Garden.jpeg"
    },
    {
      name: "Buckstones Jump",
      desc: "A wild swimming pool fed by natural waterfalls.",
      coords: [54.4611010, -2.9787970],
      image: "to-do/Jump.jpeg"
    },
    {
      name: "Also Search for Loughrigg Mountain, Brochole Zip World, Low Wood Watersports, Wray Castle ",
      desc: "A panoramic hike with lake and fell views.",
      coords: [54.4335341, -2.9743217],
      image: "to-do/Loughrigg.jpeg"
    }
  ];

  places.forEach(place => {
    const marker = L.marker(place.coords).addTo(map);
    marker.bindPopup(`
      <strong>${place.name}</strong><br>
      <img src="${place.image}" alt="${place.name}" style="width:100%; max-height:150px; object-fit:cover; margin:6px 0;"><br>
      ${place.desc}<br>
      <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(place.name + ' Ambleside')}" target="_blank">Google Maps</a> |
      <a href="http://maps.apple.com/?daddr=${encodeURIComponent(place.name + ' Ambleside')}" target="_blank">Apple Maps</a>
    `);

    const listItem = document.createElement("a");
    listItem.className = "list-group-item list-group-item-action";
    listItem.innerText = place.name;
    listItem.onclick = () => {
      map.setView(place.coords, 15);
      marker.openPopup();
    };
    document.getElementById("locationList").appendChild(listItem);
  });

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
  }
</script>

  <div class="row">

<!-- Leaflet Routing Machine CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"
/>

<!-- Leaflet Routing Machine JS -->
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<script>
  // Route 1: Lakeside Picnic Loop
const routeMap = L.map('routeMap').setView([54.42086, -2.96236], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:
    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(routeMap);

const waypoints = [
  L.latLng(54.4208134, -2.9624932),
  L.latLng(54.4215492, -2.9653692),
  L.latLng(54.4319022, -2.9618420),
  L.latLng(54.4327400, -2.9511095),
  L.latLng(54.4208134, -2.9624932),
];

const placeNames = [
  'Lakeside Picnic',
  'Borrans Park',
  'Ambleside',
  'Stock Ghyll Force Waterfall',
  'Lakeside Picnic',
];

L.Routing.control({
  waypoints: waypoints,
  routeWhileDragging: false,
  show: false,
  addWaypoints: false,
  draggableWaypoints: false,
  fitSelectedRoutes: true,
  createMarker: function(i, waypoint, n) {
    return L.marker(waypoint.latLng).bindPopup(placeNames[i] || `Stop ${i}`);
  },
}).addTo(routeMap);

  // Route 2: Rydal Round
  const routeMap2 = L.map('routeMap2').setView([54.4370, -3.0168], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
}).addTo(routeMap2);

const waypoints2 = [
  L.latLng(54.4208218, -2.9625096),   // Lakeside
  L.latLng(54.4265827, -2.9695977),   // Riverside
  L.latLng(54.4318404, -2.9712315),   // Rydal Water
  L.latLng(54.4449891, -2.9789646),   // Rydal Cave
  L.latLng(54.4456921, -2.9858653),   // Stop 4 (You can name this)
  L.latLng(54.4442949, -2.9918670),   // Stop 5 (You can name this)
  L.latLng(54.4433009, -2.9964583),   // Stop 6 (You can name this)
];

const placeNames2 = [
  'Lakeside Picnic - Start',
  'Riverside - Off Road',
  'you can Turn Right to see Rothay Park - or Continuo walk to Rydal',
  'Rydal',
  'To Rydal Water - Off Road',
  'Viewpoint - Continuo to the Cave',
  'Rydal Cave - End',
];

L.Routing.control({
  waypoints: waypoints2,
  routeWhileDragging: false,
  show: false,
  addWaypoints: false,
  draggableWaypoints: false,
  fitSelectedRoutes: true,
  createMarker: function(i, waypoint, n) {
    return L.marker(waypoint.latLng).bindPopup(placeNames2[i] || `Stop ${i}`);
  },
}).addTo(routeMap2);
	
	// Route 3: Roman Fort Loop
  const routeMap3 = L.map('routeMap3').setView([54.4279, -2.9642], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(routeMap3);

  const waypoints3 = [
    L.latLng(54.4174161, -2.9565993),  // Stagshaw
    L.latLng(54.4287882, -2.9615605),  // Ambleside
    L.latLng(54.4327506, -2.9511256),  // Waterfall
    L.latLng(54.4208052, -2.9624999),  // lakeside P
  ];

  L.Routing.control({
    waypoints: waypoints3,
    routeWhileDragging: false,
    show: false,
    addWaypoints: false,
    draggableWaypoints: false,
    fitSelectedRoutes: true,
    createMarker: function(i, waypoint, n) {
      return L.marker(waypoint.latLng).bindPopup(
        i === 0
          ? 'Stop: Stagshaw Garden'
          : i === n - 1
          ? 'Start: Lakeside Picnic'
          : 'Stop ' + i
      );
    },
  }).addTo(routeMap3);

</script>

</body>
</html>
